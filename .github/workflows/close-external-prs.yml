name: Close external PRs

# Coven Cave uses staged external PR intake during the July 4, 2026 event.
# This workflow auto-closes any PR whose author isn't on the allow-list and
# points them at CONTRIBUTING.md and the issue tracker. See CONTRIBUTING.md for
# the full policy.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  close:
    name: Close non-allowlisted PR
    runs-on: ubuntu-latest
    # The maintainer allow-list. Add usernames here to grant PR access.
    # Bots required for the repo to function (dependabot, codeql, etc.) can
    # be allow-listed individually as needed.
    if: >-
      github.actor != 'BunsDev' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]'
    steps:
      - name: Comment + close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          body=$(cat <<EOF
          Thank you for the contribution, @${PR_AUTHOR}.

          Coven Cave is using **staged external PR intake** for the July 4, 2026 OpenCoven Independence Day PR Event.
          See [CONTRIBUTING.md](https://github.com/${REPO}/blob/main/CONTRIBUTING.md)
          for the full policy.

          This account is not currently on the PR allow-list, so automation is
          closing the PR and routing the work through an issue first. Please
          **open a GitHub issue** describing the change instead; the technical
          context here will not be lost, and a maintainer may ask you to reopen
          a focused PR when it fits the event queue.

          For security issues, please follow [SECURITY.md](https://github.com/${REPO}/blob/main/SECURITY.md)
          instead of opening a public issue.
          EOF
          )

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body"
          gh pr close "$PR_NUMBER" --repo "$REPO"
